<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>personajes de la saga</h1>
        <div>
            <label for="personaje">ingrese personaje</label>
            <input type="text" id="personaje">
        </div>
        <div>
            <button id="buscar">buscar</button>
        </div>
    </div>


    <script>
        fetch('https://hp-api.onrender.com/api/characters')
            .then(respuesta => respuesta.json())
            .then(data => { mostrar(data);
                document.getElementById("buscar").onclick = buscar;
            });

        let rta=[]
        function mostrar(respuesta){

           console.log(respuesta)
            respuesta.forEach(element => {
             document.body.innerHTML +=
                    `<div class="personaje">
                        <div>
                            <h1 class="nombre">nombre:${element.name} </h1>
                        </div>
                          <div class="edad">
                            <p>edad:${2026-(element.yearOfBirth)} </p>
                        </div>
                        <div class="imagen">
                            <img src="${element.image}" alt="" id="img">
                        </div>
                        <div class="descripccion">
                            <p>${element.house} </p>
                        </div>
                    </div>`
            });
            rta=respuesta
           
        }

     function buscar() {
            let nombre = document.getElementById("personaje").value;

            let encontrado = rta.find(
                item => item.name.toLowerCase() === nombre.toLowerCase()
            );

            encontrado
                ? alert("Encontrado")
                : alert("No encontrado");
        }

        document.getElementById("buscar").onclick = buscar;


        // crear una funcion para filtrar todos los estudiates de cada escuela
        
    </script>
</body>
</html>
