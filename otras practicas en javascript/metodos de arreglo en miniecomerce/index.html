<body>
    <script src="./productos.js"></script>
    <script>

        productos.forEach(element => {
            document.write(element.nombre)
        });

        //realizo una busqueda de bananas 

        if(productos.find(item =>item.nombre=="Bananas")){
            swal.fire("encontrado")
        }else{
            alert("no encontrado")
        }

        //realizo una sumatoria de todos los precios del arreglo
        let sumatoriaDeValores=productos.reduce((acumulador,producto)=>acumulador+=producto.precio,0)
       swal.fire (`la suma de todos los valores es de ${sumatoriaDeValores}`)

        let nombres = productos
            .filter(producto => producto.nombre[0].toLowerCase().startsWith("c"))
            .map(producto => producto.nombre);

        alert(nombres);
