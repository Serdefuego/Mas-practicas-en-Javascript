<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutería</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            width: 150px;
            text-align: center;
        }

        .emoji {
            font-size: 40px;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
        }

        #contenedorCompra {
            margin-top: 30px;
            border-top: 2px solid black;
            padding-top: 20px;
        }
    </style>
</head>

<body>

    <script>

        const productos = [
            { imagen: "🍌", nombre: "Bananas", precio: 220 },
            { imagen: "🍎", nombre: "Manzanas", precio: 200 },
            { imagen: "🥝", nombre: "Kiwis", precio: 280 },
            { imagen: "🍈", nombre: "Melón", precio: 350 },
            { imagen: "🍍", nombre: "Piñas", precio: 320 },
            { imagen: "🍅", nombre: "Tomates", precio: 140 },
            { imagen: "🥥", nombre: "Cocos", precio: 270 },
            { imagen: "🍉", nombre: "Sandías", precio: 200 },
            { imagen: "🍑", nombre: "Duraznos", precio: 310 },
            { imagen: "🫐", nombre: "Arándanos", precio: 650 },
            { imagen: "🥭", nombre: "Mango", precio: 290 },
            { imagen: "🍇", nombre: "Uvas", precio: 700 },
            { imagen: "🍐", nombre: "Peras", precio: 320 },
            { imagen: "🍒", nombre: "Cerezas", precio: 1100 },
            { imagen: "🍓", nombre: "Frutillas", precio: 600 },
            { imagen: "🍋", nombre: "Limones", precio: 260 }
        ];

        // Recupera compras previas
        let compra = JSON.parse(localStorage.getItem("comprado")) || [];

        // Contenedor principal
        let contenedor = document.createElement("div");
        contenedor.className = "container";
        contenedor.id = "contenedorPrincipal";
        document.body.appendChild(contenedor);

        // Botón carrito
        let botonCarro = document.createElement("button");
        botonCarro.textContent = "🛒 Ver carrito";
        botonCarro.addEventListener("click", carrito);
        document.body.appendChild(botonCarro);

        // Contenedor del carrito
        let contenedorCompra = document.createElement("div");
        contenedorCompra.id = "contenedorCompra";
        document.body.appendChild(contenedorCompra);

        // Función comprar
        function comprar(producto) {

            compra.push(producto);

            localStorage.setItem(
                "comprado",
                JSON.stringify(compra)
            );

            alert(`${producto.nombre} agregado al carrito`);
        }

        // Crear cards
        productos.forEach(item => {

            let card = document.createElement("div");
            card.className = "card";

            let emoji = document.createElement("p");
            emoji.className = "emoji";
            emoji.textContent = item.imagen;

            let nombre = document.createElement("h3");
            nombre.textContent = item.nombre;

            let precio = document.createElement("p");
            precio.textContent = `$${item.precio}`;

            let boton = document.createElement("button");
            boton.textContent = "Comprar";

            boton.addEventListener("click", () => {
                comprar(item);
            });

            card.appendChild(emoji);
            card.appendChild(nombre);
            card.appendChild(precio);
            card.appendChild(boton);

            contenedor.appendChild(card);
        });

        // Mostrar carrito
        function carrito() {

            contenedorCompra.innerHTML = "";

            let comprasGuardadas =
                JSON.parse(localStorage.getItem("comprado")) || [];

            let titulo = document.createElement("h2");
            titulo.textContent = "Carrito de compras";
            contenedorCompra.appendChild(titulo);

            if (comprasGuardadas.length === 0) {

                let mensaje = document.createElement("p");
                mensaje.textContent = "El carrito está vacío";
                contenedorCompra.appendChild(mensaje);
                return;
            }

            let total = 0;

            comprasGuardadas.forEach(item => {

                let producto = document.createElement("p");

                producto.textContent =
                    `${item.imagen} ${item.nombre} - $${item.precio}`;

                contenedorCompra.appendChild(producto);

                total += item.precio;
            });

            let totalCompra = document.createElement("h3");
            totalCompra.textContent = `Total: $${total}`;

            contenedorCompra.appendChild(totalCompra);
        }

        // Guarda el catálogo
        localStorage.setItem("lista",JSON.stringify(productos));

    </script>

</body>

</html>
