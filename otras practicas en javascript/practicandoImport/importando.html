<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
</head>
<body>

    <div id="productos"></div>


    //aqui hago la importacion del arreglo productos que se encuentra en el archivo js
    <script type="module">
        import productos from './productos.js';

        console.log(productos);

        const contenedor = document.getElementById("productos");

        productos.forEach(producto => {
            contenedor.innerHTML += `
                <div>
                    <h2>${producto.imagen} ${producto.nombre}</h2>
                    <p>$${producto.precio}</p>
                </div>
            `;
        });
    </script>

</body>
</html>
